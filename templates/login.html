{% extends "base.html" %}
{% block titulo %}Ingreso del personal{% endblock %}
{% block contenido %}
<section class="tarjeta formulario angosto">
  <h1>Ingreso del personal</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Correo<input type="email" name="email" required maxlength="120" autocomplete="username"></label>
    <label>Contraseña<input type="password" name="password" required maxlength="200" autocomplete="current-password"></label>
    <button class="btn" type="submit">Ingresar</button>
  </form>
  <p class="ayuda">Tras 5 intentos fallidos la cuenta se bloquea 15 minutos.</p>
</section>
{% endblock %}
