{% extends "base.html" %}
{% block titulo %}Productos{% endblock %}
{% block contenido %}
<h1>Productos</h1>
<p><a class="btn" href="{{ url_for('panel.producto_nuevo') }}">+ Nuevo producto</a></p>
<table class="tabla">
  <thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead>
  <tbody>{% for p in filas %}
  <tr><td>{{ p.nombre }}</td><td>{{ p.precio|clp }}</td><td>{{ p.stock }}</td><td>{{ 'Publicado' if p.activo else 'Oculto' }}</td>
      <td><a class="btn btn-claro" href="{{ url_for('panel.producto_editar', pid=p.id) }}">Editar</a></td></tr>
  {% endfor %}</tbody>
</table>
{% endblock %}
